services:
  - type: web
    name: ceat-safety-reporting
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
